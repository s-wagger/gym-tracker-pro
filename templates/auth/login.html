{% extends "base.html" %}

{% block title %}Log In | Gym Tracker Pro{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
  <div class="gt-card p-8 bg-[#1E1E1E] border border-gray-800 shadow-2xl relative overflow-hidden">
    <!-- Top accent strip -->
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-[#CCFF00] via-[#FFD700] to-[#CCFF00]"></div>

    <div class="text-center mb-6">
      <div class="w-12 h-12 mx-auto mb-3 rounded-2xl bg-[#CCFF00]/10 border border-[#CCFF00]/30 flex items-center justify-center text-xl text-[#CCFF00]">
        ⚡
      </div>
      <h1 class="text-2xl font-black text-white">Welcome Back</h1>
      <p class="text-gray-400 text-xs mt-1">Sign in to your Gym Tracker Pro personal hub</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Username or Email</label>
        <input type="text" name="identifier" required placeholder="athlete or athlete@gym.com" class="gt-input w-full">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-bold text-gray-300 uppercase">Password</label>
        </div>
        <input type="password" name="password" required placeholder="••••••••" class="gt-input w-full">
      </div>

      <div class="flex items-center justify-between text-xs text-gray-400">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="remember" class="w-4 h-4 accent-[#CCFF00] rounded">
          <span>Remember me</span>
        </label>
        <span class="text-gray-500">Bcrypt Protected</span>
      </div>

      <button type="submit" class="neon-btn w-full py-3 px-4 rounded-xl font-black text-sm uppercase tracking-wider shadow-lg shadow-[#CCFF00]/20">
        Sign In to Hub
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-gray-800 text-center text-xs text-gray-400">
      Don't have an account yet? 
      <a href="{{ url_for('register') }}" class="text-[#CCFF00] font-bold hover:underline ml-1">
        Sign up now
      </a>
    </div>
  </div>
</div>
{% endblock %}
