{% extends "base.html" %}

{% block title %}Log In | Gym Tracker Pro{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
  <div class="gt-card p-8 bg-[#101C3D] border border-[#E6D5B8]/30 shadow-2xl relative overflow-hidden">
    <!-- Top accent strip in Royal Blue & Beige -->
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-[#2563EB] via-[#E6D5B8] to-[#2563EB]"></div>

    <div class="text-center mb-6">
      <div class="w-12 h-12 mx-auto mb-3 rounded-2xl bg-[#E6D5B8]/15 border border-[#E6D5B8]/30 flex items-center justify-center text-xl text-[#E6D5B8] shadow-lg shadow-blue-900/30">
        <svg class="w-6 h-6 text-[#E6D5B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 5v14M18 5v14M2 9v6M22 9v6M6 12h12"/>
        </svg>
      </div>
      <h1 class="text-2xl font-black text-white">Welcome Back</h1>
      <p class="text-slate-400 text-xs mt-1">Sign in to your Gym Tracker Pro executive hub</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Username or Email</label>
        <input type="text" name="identifier" required placeholder="athlete or athlete@gym.com" class="gt-input w-full">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-bold text-gray-300 uppercase">Password</label>
        </div>
        <input type="password" name="password" required placeholder="••••••••" class="gt-input w-full">
      </div>

      <div class="flex items-center justify-between text-xs text-slate-400">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="remember" class="w-4 h-4 accent-[#2563EB] rounded">
          <span>Remember me</span>
        </label>
        <span class="text-slate-500">Bcrypt Protected</span>
      </div>

      <button type="submit" class="btn-royal w-full py-3 px-4 rounded-xl font-black text-sm uppercase tracking-wider shadow-lg shadow-blue-600/30">
        Sign In to Hub
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-gray-800 text-center text-xs text-slate-400">
      Don't have an account yet? 
      <a href="{{ url_for('register') }}" class="text-[#E6D5B8] font-bold hover:underline ml-1">
        Sign up now
      </a>
    </div>
  </div>
</div>
{% endblock %}
